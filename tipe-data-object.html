<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipe data object</title>
</head>
<body>
    <script>
        const orang = {
            "nama lengkap": "Rajie Al Qadri Anwar",
            alamat: "Indonesia",
            umur: 17,
        };

        console.info(`Nama : ${orang["nama lengkap"]}`);
        console.info(`Alamat : ${orang.alamat}`);
        console.info(`Umur : ${orang.umur} tahun`);

        console.table(orang);
        delete orang["Umur"];
        console.table(orang);
    </script>
</body>
</html>
